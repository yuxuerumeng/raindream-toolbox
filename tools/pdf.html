<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 合并 — ToolBox</title>
<meta name="description" content="在线PDF合并工具，上传多个PDF文件，拖拽排序，一键合并下载。浏览器本地处理，无需上传。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>
<nav class="nav">
  <a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg data-i18n="back_home">返回首页</a>
  <a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a>
</nav>
<header class="tool-header"><h1 data-i18n="tool_pdf_title">PDF 合并</h1><p class="desc" data-i18n="tool_pdf_desc_full">上传多个 PDF 文件，拖拽排序，一键合并下载。</p></header>
<div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 — 部署后替换为 AdSense 代码 ]</span></div>
<div class="tool-body">
  <div class="upload-zone" id="dz">
    <div class="upload-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
    <p data-i18n="upload_pdf_drop">拖拽 PDF 文件到此处（可多选）</p><p class="or" data-i18n="upload_or">或</p>
    <button class="btn-sm" onclick="document.getElementById('fi').click()" data-i18n="select_file">选择文件
    <input type="file" id="fi" accept=".pdf" multiple>
  </div>
  <div class="file-list" id="list"></div>
  <div class="result-bar" id="rb"><button class="btn-primary" id="merge" disabled data-i18n="merge_btn">合并并下载</div>
</div>
<div class="ad-slot horizontal"><span>[ 广告位 ]</span></div>
<footer class="site-footer"><p data-i18n="footer_privacy">所有处理均在浏览器本地完成。</p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
let files=[];
function add(fs){for(const f of fs){if(f.type==='application/pdf'||f.name.endsWith('.pdf'))files.push(f)}render()}
function render(){
  document.getElementById('list').innerHTML=files.map((f,i)=>`
    <div class="file-item">
      <span class="fname">${f.name}</span><span class="fsize">${fmt(f.size)}</span>
      <button class="fbtn arrow" data-i="${i}" ${i?'':'disabled'}>↑</button>
      <button class="fbtn arrow" data-i="${i}" ${i===files.length-1?'disabled':''}>↓</button>
      <button class="fbtn" data-i="${i}">✕</button>
    </div>`).join('');
  document.querySelectorAll('.fbtn.arrow[data-i]').forEach(b=>{
    const i=parseInt(b.dataset.i);b.onclick=()=>{
      if(b.textContent===String.fromCharCode(8593)&&i>0){[files[i],files[i-1]]=[files[i-1],files[i]]}
      else if(b.textContent===String.fromCharCode(8595)&&i<files.length-1){[files[i],files[i+1]]=[files[i+1],files[i]]}
      render();}});
  document.querySelectorAll('.fbtn:not(.arrow)').forEach(b=>b.onclick=()=>{files.splice(parseInt(b.dataset.i),1);render()});
  document.getElementById('merge').disabled=files.length<2;
  document.getElementById('rb').classList.toggle('show',files.length>0);
}
document.getElementById('merge').onclick=async()=>{
  if(files.length<2)return;const btn=document.getElementById('merge');btn.disabled=true;btn.textContent='合并中...';
  const {PDFDocument}=PDFLib;const m=await PDFDocument.create();
  for(const f of files){const d=await PDFDocument.load(await f.arrayBuffer());const pp=await m.copyPages(d,d.getPageIndices());pp.forEach(p=>m.addPage(p))}
  const bytes=await m.save();download(new Blob([bytes],{type:'application/pdf'}),'merged.pdf');
  btn.disabled=false;btn.textContent='合并并下载';
};
const dz=document.getElementById('dz');
dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag-over')};
dz.ondragleave=()=>dz.classList.remove('drag-over');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drag-over');add(e.dataTransfer.files)};
document.getElementById('fi').onchange=e=>{add(e.target.files)};
function fmt(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB'}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
</script>
<script src="../js/theme.js"></script><script src="../js/i18n.js"></script></body>
</html>
