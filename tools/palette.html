<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>调色板生成 — ToolBox</title>
<meta name="description" content="上传图片智能提取配色方案，点击色块即可复制色号。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script>
</head>
<body>
<nav class="nav">
  <a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg data-i18n="back_home">返回首页</a>
  <a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a>
</nav>
<header class="tool-header"><h1>调色板生成</h1><p class="desc">上传图片，自动提取主要配色方案。点击色块即可复制色号。</p></header>
<div class="tool-body">
  <div class="upload-zone" id="dz">
    <div class="upload-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20"/><path d="M12 2a10 10 0 0 0 0 20"/></svg></div>
    <p>拖拽图片到此处提取配色</p><p class="or">或</p>
    <button class="btn-sm" onclick="document.getElementById('fi').click()">选择文件</button>
    <input type="file" id="fi" accept="image/*">
  </div>
  <div class="palette-row" id="colors"></div>
</div>
<div class="ad-slot horizontal"><span>[ 广告位 ]</span></div>
<footer class="site-footer"><p data-i18n="footer_privacy">所有处理均在浏览器本地完成。</p></footer>
<div class="toast" id="toast"></div>
<script>
function handle(f){
  if(!f.type.startsWith('image/'))return;
  const img=new Image();img.src=URL.createObjectURL(f);
  img.onload=()=>{
    const c=document.createElement('canvas');const s=Math.min(1,200/Math.max(img.width,img.height));
    c.width=img.width*s;c.height=img.height*s;
    const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);
    const d=ctx.getImageData(0,0,c.width,c.height).data,map={};
    for(let i=0;i<d.length;i+=4){
      const r=Math.round(d[i]/32)*32,g=Math.round(d[i+1]/32)*32,b=Math.round(d[i+2]/32)*32;
      map[`${r},${g},${b}`]=(map[`${r},${g},${b}`]||0)+1;
    }
    const sorted=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([k])=>{const [r,g,b]=k.split(',').map(Number);return{r,g,b}});
    const filtered=[sorted[0]];
    for(let i=1;i<sorted.length&&filtered.length<6;i++){if(filtered.every(f=>dist(sorted[i],f)>60))filtered.push(sorted[i])}
    document.getElementById('colors').innerHTML=filtered.map(c=>{
      const h=hex(c.r,c.g,c.b);
      return '<div class="swatch-block" style="background:'+h+'" data-h="'+h+'"><span class="sw-hex">'+h+'</span></div>';
    }).join('');
    document.querySelectorAll('.swatch-block').forEach(s=>s.onclick=()=>{navigator.clipboard.writeText(s.dataset.h);show(s.dataset.h)});
  };
}
const dz=document.getElementById('dz');
dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag-over')};
dz.ondragleave=()=>dz.classList.remove('drag-over');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drag-over');handle(e.dataTransfer.files[0])};
document.getElementById('fi').onchange=e=>{if(e.target.files[0])handle(e.target.files[0])};
function hex(r,g,b){return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')}
function dist(a,b){return Math.sqrt((a.r-b.r)**2+(a.g-b.g)**2+(a.b-b.b)**2)}
function show(m){const t=document.getElementById('toast');t.textContent='已复制 '+m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
</script>
<script src="../js/i18n.js"></script></body>
</html>
