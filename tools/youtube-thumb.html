<header class="tool-header"><h1 data-i18n="tool_ytthumb_title">YouTube 视频下载</h1><p class="desc" data-i18n="tool_ytthumb_desc_full">粘贴YouTube链接，即可播放和下载。</p></header>
<div class="tool-body">
  <div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 ]</span></div>
  <div class="form-group"><label>YouTube 链接</label>
    <div style="display:flex;gap:.5rem"><input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..."><button class="btn-primary" id="load" style="white-space:nowrap">播放</button></div>

<script>
function getYTId(u){var m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null}
document.getElementById('load').onclick=function(){
  var u=document.getElementById('url').value.trim();
  var id=getYTId(u);
  if(!id){document.getElementById('player').innerHTML='<p style="color:#ff453a">无效链接</p>';return}
  var sizes=[{label:'4K',key:'maxresdefault'},{label:'HD',key:'hqdefault'},{label:'SD',key:'sddefault'},{label:'MQ',key:'mqdefault'}];
  var h='<div class="player-wrap"><iframe src="https://www.youtube.com/embed/'+id+'" allowfullscreen></iframe></div>';
  h+='<div style="margin-top:1rem"><strong>下载视频</strong></div>';
  h+='<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem">';
  h+='<a href="https://www.y2mate.com/youtube/'+id+'" target="_blank" class="btn-primary">y2mate 下载</a>';
  h+='<a href="https://en.savefrom.net/1-youtube-video-downloader-'+id+'/" target="_blank" class="btn-outline">SaveFrom 下载</a>';
  h+='<a href="https://www.youtube.com/watch?v='+id+'" target="_blank" class="btn-sm">在YouTube打开</a>';
  h+='</div>';
  h+='<div style="margin-top:1.25rem"><strong>下载缩略图</strong></div>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:.75rem;margin-top:.5rem">';
  sizes.forEach(function(s){h+='<div class="preview-card" style="flex:1;min-width:140px"><div class="p-label">'+s.label+'</div><img src="https://img.youtube.com/vi/'+id+'/'+s.key+'.jpg" style="width:100%;border-radius:8px" onerror="this.parentElement.style.display=\'none\'"><a href="https://img.youtube.com/vi/'+id+'/'+s.key+'.jpg" download class="btn-sm" style="margin-top:.4rem;display:block;text-align:center">下载</a></div>'});
  h+='</div>';
  document.getElementById('player').innerHTML=h;
};
</script>
