<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube 视频下载 — ToolBox</title>
<meta name="description" content="YouTube视频信息获取+缩略图下载工具。">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script>
</head><body>
<nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span data-i18n="back_home">返回首页</span></a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav>
<header class="tool-header"><h1 data-i18n="tool_ytthumb_title">YouTube 视频下载</h1><p class="desc" data-i18n="tool_ytthumb_desc_full">粘贴 YouTube 链接，获取视频信息和缩略图。</p></header>
<div class="tool-body">
  <div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 ]</span></div>
  <div class="form-group"><label>YouTube URL</label><input type="text" id="url" placeholder="https://www.youtube.com/watch?v=... 或 https://youtu.be/..."></div>
  <button class="btn-primary" id="extract">获取视频信息</button>
  <div id="result" style="margin-top:1.5rem"></div>
</div>
<div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 ]</span></div>
<footer class="site-footer"><p data-i18n="footer_privacy">所有处理均在浏览器本地完成。</p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p></footer>
<script src="../js/theme.js"></script><script src="../js/i18n.js"></script>
<script>
document.getElementById('extract').onclick=async()=>{
  const u=document.getElementById('url').value.trim();
  const res=document.getElementById('result');
  if(!u){res.innerHTML='<p style="color:#ff453a">请输入链接</p>';return}
  res.innerHTML='<p style="color:var(--text3)">加载中...</p>';
  try{
    const r=await fetch('/api/youtube?url='+encodeURIComponent(u));
    const d=await r.json();
    if(d.error){res.innerHTML='<p style="color:#ff453a">'+d.error+'</p>';return}
    const sizes=[
      {label:'最大分辨率',key:'max'},
      {label:'高清',key:'hq'},
      {label:'标准',key:'sd'},
      {label:'中等',key:'mq'}
    ];
    let h=`<div style="margin-bottom:1rem"><strong>${d.title||'无标题'}</strong></div>
      <div style="font-size:.78rem;color:var(--text3);margin-bottom:1rem">作者: ${d.author||'未知'}</div>
      <div style="display:flex;flex-wrap:wrap;gap:1rem">`;
    sizes.forEach(s=>{
      if(d.thumbnails&&d.thumbnails[s.key]){
        h+=`<div class="preview-card" style="flex:1;min-width:200px"><div class="p-label">${s.label}</div>
          <img src="${d.thumbnails[s.key]}" alt="" style="width:100%;border-radius:8px" onerror="this.parentElement.style.display='none'">
          <a href="${d.thumbnails[s.key]}" download class="btn-sm" style="margin-top:.5rem;display:block;text-align:center">下载</a></div>`;
      }
    });
    h+='</div>';
    res.innerHTML=h;
  }catch(e){res.innerHTML='<p style="color:#ff453a">请求失败: '+e.message+'</p>'}
};
</script>
</body></html>
