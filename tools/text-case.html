<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大小写转换 — ToolBox</title>
<meta name="description" content="在线文本大小写转换，支持大写、小写、首字母大写、驼峰等。">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head><body>
<nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg data-i18n="back_home">返回首页</a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav>
<header class="tool-header"><h1 data-i18n="tool_textcase_title">大小写转换</h1><p class="desc" data-i18n="tool_textcase_desc_full">输入文本，选择转换方式，一键复制结果。</p></header>
<div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 — 部署后替换为 AdSense 代码 ]</span></div>
<div class="tool-body">
  <div class="form-group"><label data-i18n="输入文本">输入文本<textarea id="input" data-i18n-placeholder="placeholder_输入要转换的文本..." placeholder="输入要转换的文本..." data-i18n-placeholder="input_content"></textarea></div>
  <div class="control-row" style="flex-wrap:wrap">
    <button class="btn-sm case-btn" data-mode="upper" data-i18n="全大写">全大写
    <button class="btn-sm case-btn" data-mode="lower" data-i18n="全小写">全小写
    <button class="btn-sm case-btn" data-mode="title" data-i18n="首字母大写">首字母大写
    <button class="btn-sm case-btn" data-mode="sentence" data-i18n="句首大写">句首大写
    <button class="btn-sm case-btn" data-mode="camel" data-i18n="驼峰命名">驼峰命名
    <button class="btn-sm case-btn" data-mode="snake" data-i18n="蛇形命名">蛇形命名
    <button class="btn-sm case-btn" data-mode="kebab" data-i18n="短横命名">短横命名
  </div>
  <div class="form-group"><label data-i18n="label_output">输出结果<textarea id="output" readonly></textarea></div>
  <button class="btn-sm" id="copy" data-i18n="btn_copy">复制结果
</div>
<div class="ad-slot horizontal"><span>[ 广告位 ]</span></div>
<footer class="site-footer"><p><span data-i18n="footer_copy">&copy; 2026 ToolBox</span></p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p>
</footer>
<div class="toast" id="toast"></div>
<script>
const modes={
  upper:s=>s.toUpperCase(),
  lower:s=>s.toLowerCase(),
  title:s=>s.replace(/\b\w/g,c=>c.toUpperCase()),
  sentence:s=>s.replace(/(^\s*\w|[.!?]\s+\w)/g,c=>c.toUpperCase()),
  camel:s=>s.toLowerCase().replace(/[^a-z0-9]+(.)/g,(_,c)=>c.toUpperCase()).replace(/^./,c=>c.toLowerCase()),
  snake:s=>s.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,''),
  kebab:s=>s.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'')
};
document.querySelectorAll('.case-btn').forEach(b=>b.onclick=()=>{
  document.getElementById('output').value=modes[b.dataset.mode](document.getElementById('input').value);
});
document.getElementById('copy').onclick=()=>{const v=document.getElementById('output').value;if(v){navigator.clipboard.writeText(v);show('已复制')}};
function show(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
</script>
<script src="../js/theme.js"></script><script src="../js/i18n.js"></script></body></html>
