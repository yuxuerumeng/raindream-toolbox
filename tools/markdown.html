<header class="tool-header"><h1>Markdown 预览</h1><p class="desc">左侧编写 Markdown，右侧即时预览。</p></header>
<div class="tool-body" style="max-width:960px">
  <div style="display:flex;gap:1rem;flex-wrap:wrap">
    <div style="flex:1;min-width:0"><div class="form-group"><label>Markdown 输入</label><textarea id="input" style="height:400px"># Hello Markdown
**粗体** *斜体* [链接](https://example.com)
- 列表项 1
- 列表项 2
> 引用文字
</textarea></div><button class="btn-sm" id="export">导出 HTML</button></div>
    <div style="flex:1;min-width:0"><div class="p-label" style="margin-bottom:.5rem">预览</div><div class="md-preview" id="preview" style="background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.04);border-radius:10px;padding:1.25rem;min-height:400px"></div></div>
  </div>
</div>
<div class="ad-slot horizontal"><span>[ 广告位 ]</span></div>
<footer class="site-footer"><p><span data-i18n="footer_copy">&copy; 2026 ToolBox</span></p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p>
</footer>
<script>
const input=document.getElementById('input'),preview=document.getElementById('preview');
function parse(s){
  return s.replace(/### (.+)/g,'<h3>$1</h3>').replace(/## (.+)/g,'<h2>$1</h2>').replace(/# (.+)/g,'<h1>$1</h1>')
   .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')
   .replace(/`{3}(\w*)\n?([\s\S]*?)`{3}/g,'<pre><code>$2</code></pre>')
   .replace(/`([^`]+)`/g,'<code>$1</code>')
   .replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank">$1</a>')
   .replace(/!\[(.*?)\]\((.+?)\)/g,'<img alt="$1" src="$2">')
   .replace(/^> (.+)/gm,'<blockquote>$1</blockquote>')
   .replace(/^- (.+)/gm,'<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>')
   .replace(/^(\d+)\. (.+)/gm,'<li>$2</li>').replace(/<li>/g,(m,o)=>o===0?'<ol><li>':m)
   .replace(/\n\n/g,'</p><p>').replace(/^(?!<)/gm,'<p>$&').replace(/<\/p><p>/g,'</p>\n<p>')
   .replace(/<p><\/p>/g,'');
}
input.addEventListener('input',()=>{preview.innerHTML='<p>'+parse(input.value)+'</p>'});
preview.innerHTML='<p>'+parse(input.value)+'</p>';
document.getElementById('export').onclick=()=>{
  const html='<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:system-ui;max-width:800px;margin:2rem auto;padding:0 1rem;line-height:1.6;color:#333}pre{background:#f4f4f4;padding:1rem;border-radius:6px;overflow:auto}code{background:#f4f4f4;padding:.15em .4em;border-radius:3px}blockquote{border-left:3px solid #ddd;padding-left:1em;color:#666}img{max-width:100%}table{border-collapse:collapse}td,th{border:1px solid #ddd;padding:.4em}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head><body>'+preview.innerHTML+'<script src="../js/i18n.js"></script></body></html>';
  const blob=new Blob([html],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='markdown.html';a.click()
};
</script>
<script src="../js/i18n.js"></script></body></html>
