etMonth(),b.getDate()),d=Math.floor((nb-n)/864e5);document.getElementById("age").textContent=y+" 岁";document.getElementById("detail").textContent="下次生日还有 "+d+" 天"}document.getElementById("birth").onchange=c;c();</script></body></html>
