<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字数统计 — ToolBox</title>
<meta name="description" content="在线字数统计，字符数、单词数、行数一键统计。">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script>
</head><body>
<nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span data-i18n="back_home">返回首页</span></a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav>
<header class="tool-header"><h1 data-i18n="tool_wordcount_title">字数统计</h1><p class="desc" data-i18n="tool_wordcount_desc_full">粘贴文本，实时统计字数、字符数、行数。</p></header>
<div class="tool-body">
  <div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 ]</span></div>
  <div class="form-group"><label data-i18n="输入文本">输入文本<textarea id="input" data-i18n-placeholder="placeholder_输入或粘贴文本..." placeholder="输入或粘贴文本..." style="height:250px"></textarea></div>
  <div class="control-row" style="display:flex;gap:2rem;justify-content:center">
    <div style="text-align:center"><div style="font-size:2rem;font-weight:700;color:var(--accent)" id="chars">0</div><div style="font-size:.72rem;color:var(--text3)">字符</div></div>
    <div style="text-align:center"><div style="font-size:2rem;font-weight:700;color:var(--accent)" id="words">0</div><div style="font-size:.72rem;color:var(--text3)">单词</div></div>
    <div style="text-align:center"><div style="font-size:2rem;font-weight:700;color:var(--accent)" id="lines">0</div><div style="font-size:.72rem;color:var(--text3)">行</div></div>
    <div style="text-align:center"><div style="font-size:2rem;font-weight:700;color:var(--accent)" id="cnchars">0</div><div style="font-size:.72rem;color:var(--text3)">中文字</div></div>
  </div>
</div>
<div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 ]</span></div>
<footer class="site-footer"><p data-i18n="footer_privacy">所有处理均在浏览器本地完成。</p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p></footer>
<script src="../js/theme.js"></script><script src="../js/i18n.js"></script>
<script>
document.getElementById('input').addEventListener('input',function(){
  const t=this.value;
  document.getElementById('chars').textContent=t.length;
  document.getElementById('words').textContent=t.trim()?t.trim().split(/\s+/).length:0;
  document.getElementById('lines').textContent=t?t.split('\n').length:0;
  document.getElementById('cnchars').textContent=(t.match(/[\u4e00-\u9fff]/g)||[]).length;
});
</script>
</body></html>
