<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码生成器 — ToolBox</title>
<meta name="description" content="在线随机密码生成器，自定义长度和字符集。">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script>
</head><body>
<nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg data-i18n="back_home">返回首页</a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav>
<header class="tool-header"><h1>密码生成器</h1><p class="desc">生成随机强密码，自定义长度和字符类型。</p></header>
<div class="tool-body" style="max-width:500px">
  <div class="form-group"><label>密码长度</label><input type="range" id="len" min="8" max="64" value="16"><span id="lenVal" style="font-size:.78rem;color:rgba(255,255,255,.4);margin-left:.5rem">16</span></div>
  <div class="form-group" style="display:flex;flex-wrap:wrap;gap:.75rem">
    <label style="display:flex;align-items:center;gap:.3rem;font-size:.8rem;color:rgba(255,255,255,.6);cursor:pointer"><input type="checkbox" id="upper" checked> 大写字母</label>
    <label style="display:flex;align-items:center;gap:.3rem;font-size:.8rem;color:rgba(255,255,255,.6);cursor:pointer"><input type="checkbox" id="lower" checked> 小写字母</label>
    <label style="display:flex;align-items:center;gap:.3rem;font-size:.8rem;color:rgba(255,255,255,.6);cursor:pointer"><input type="checkbox" id="num" checked> 数字</label>
    <label style="display:flex;align-items:center;gap:.3rem;font-size:.8rem;color:rgba(255,255,255,.6);cursor:pointer"><input type="checkbox" id="sym"> 符号</label>
  </div>
  <button class="btn-primary" id="gen">生成密码</button>
  <div class="code-output" id="result" style="font-size:1.1rem;text-align:center;letter-spacing:.05em;margin-top:1.25rem;min-height:50px;display:flex;align-items:center;justify-content:center"></div>
  <div style="text-align:center;margin-top:.5rem"><button class="btn-sm" id="copy">复制密码</button></div>
  <div id="strength" style="text-align:center;font-size:.75rem;color:rgba(255,255,255,.35);margin-top:.5rem"></div>
</div>
<div class="ad-slot horizontal"><span>[ 广告位 ]</span></div>
<footer class="site-footer"><p><span data-i18n="footer_copy">&copy; 2026 ToolBox</span></p></footer>
<div class="toast" id="toast"></div>
<script>
const len=document.getElementById('len'),lv=document.getElementById('lenVal');
len.oninput=()=>lv.textContent=len.value;
function gen(){
  let chars='';
  if(document.getElementById('upper').checked)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(document.getElementById('lower').checked)chars+='abcdefghijklmnopqrstuvwxyz';
  if(document.getElementById('num').checked)chars+='0123456789';
  if(document.getElementById('sym').checked)chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
  if(!chars){document.getElementById('result').textContent='请至少选择一种字符类型';return}
  let pwd='';for(let i=0;i<parseInt(len.value);i++)pwd+=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('result').textContent=pwd;
  const s=Math.min(4,Math.floor(pwd.length/8)+(/[A-Z]/.test(pwd)?1:0)+(/[a-z]/.test(pwd)?1:0)+(/\d/.test(pwd)?1:0)+(/[^a-zA-Z\d]/.test(pwd)?1:0));
  document.getElementById('strength').textContent='强度: '+['','弱','一般','强','极强'][s];
}
document.getElementById('gen').onclick=gen;
document.getElementById('copy').onclick=()=>{const v=document.getElementById('result').textContent;if(v&&v.length>2){navigator.clipboard.writeText(v);show('已复制')}};
gen();
function show(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
</script>
<script src="../js/i18n.js"></script></body></html>
