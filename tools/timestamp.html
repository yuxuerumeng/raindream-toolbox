<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间戳转换 — ToolBox</title>
<meta name="description" content="Unix时间戳与日期双向转换工具。">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head><body>
<nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg data-i18n="back_home">返回首页</a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav>
<header class="tool-header"><h1>时间戳转换</h1><p class="desc">Unix 时间戳与日期双向转换，支持秒/毫秒。</p></header>
<div class="tool-body" style="max-width:500px">
  <div class="form-group"><label>Unix 时间戳 → 日期</label>
    <div style="display:flex;gap:.5rem"><input type="text" id="tsInput" placeholder="例如: 1700000000" style="flex:1"><select id="unit"><option value="s">秒</option><option value="ms">毫秒</option></select><button class="btn-primary" id="ts2date">转换</button></div>
    <div class="code-output" id="tsResult"></div>
  </div>
  <div class="form-group" style="margin-top:1.5rem"><label>日期 → Unix 时间戳</label>
    <input type="datetime-local" id="dateInput">
    <button class="btn-primary" id="date2ts" style="margin-top:.5rem">获取时间戳</button>
    <div class="code-output" id="dateResult"></div>
  </div>
  <div class="code-output" id="currentTs" style="margin-top:1rem">当前时间戳: </div>
</div>
<div class="ad-slot horizontal"><span>[ 广告位 ]</span></div>
<footer class="site-footer"><p><span data-i18n="footer_copy">&copy; 2026 ToolBox</span></p></footer>
<script>
const ct=document.getElementById('currentTs');
setInterval(()=>{ct.textContent='当前时间戳: '+Math.floor(Date.now()/1000)+' (秒) | '+Date.now()+' (毫秒) | '+new Date().toLocaleString('zh-CN')},1000);
document.getElementById('ts2date').onclick=()=>{
  let v=parseInt(document.getElementById('tsInput').value);
  if(isNaN(v)){document.getElementById('tsResult').textContent='请输入有效数字';return}
  if(document.getElementById('unit').value==='s')v*=1000;
  const d=new Date(v);
  document.getElementById('tsResult').textContent=d.toLocaleString('zh-CN')+'\nISO: '+d.toISOString()+'\nUTC: '+d.toUTCString();
};
document.getElementById('date2ts').onclick=()=>{
  const v=document.getElementById('dateInput').value;
  if(!v){document.getElementById('dateResult').textContent='请选择日期';return}
  const ts=Math.floor(new Date(v).getTime()/1000);
  document.getElementById('dateResult').textContent=ts+' (秒)\n'+new Date(v).getTime()+' (毫秒)';
};
</script>
<script src="../js/i18n.js"></script></body></html>
