<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>秒表 — ToolBox</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="icon" type="image/svg+xml" href="../favicon.svg"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script></head><body><nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span data-i18n="back_home">返回首页</span></a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav><header class="tool-header"><h1 data-i18n="tool_miao_biao_ji_shi">秒表计时</h1><p class="desc" data-i18n="tool_jing_que_ji_shi_qi_zhi_chi_ji_ci_">精确计时器，支持计次。</p></header><div class="tool-body"><div class="ad-slot horizontal"><span data-i18n="ad_placeholder">Ad</span></div><div style="text-align:center"><div style="font-size:4rem;font-weight:300;margin:1.5rem 0;font-family:monospace" id="d">00:00.00</div><div style="display:flex;gap:.5rem;justify-content:center"><button class="btn-primary" id="start" data-i18n="btn_start">开始<button class="btn-outline" id="lap" disabled data-i18n="btn_lap">计次<button class="btn-sm" id="reset" data-i18n="btn_reset">重置</div><div id="laps" style="margin-top:1rem;max-height:200px;overflow:auto"></div></div></div><div class="ad-slot horizontal"><span data-i18n="ad_placeholder">Ad</span></div><footer class="site-footer"><p data-i18n="footer_privacy">所有处理均在浏览器本地完成。</p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p></footer><script src="../js/theme.js"></script><script src="../js/i18n.js"></script><script>let t=0,iv=null,r=!1;function f(m){let n=Math.floor(m/6e4),s=Math.floor(m%6e4/1e3),c=Math.floor(m%1e3/10);return String(n).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+String(c).padStart(2,"0")}document.getElementById("start").onclick=function(){if(r){clearInterval(iv);this.textContent="开始";document.getElementById("lap").disabled=!0}else{let st=Date.now()-t;iv=setInterval(function(){t=Date.now()-st;document.getElementById("d").textContent=f(t)},10);this.textContent="暂停";document.getElementById("lap").disabled=!1}r=!r};document.getElementById("lap").onclick=function(){document.getElementById("laps").innerHTML="<div>"+f(t)+"</div>"+document.getElementById("laps").innerHTML};document.getElementById("reset").onclick=function(){clearInterval(iv);t=0;r=!1;document.getElementById("d").textContent="00:00.00";document.getElementById("start").textContent="开始";document.getElementById("lap").disabled=!0;document.getElementById("laps").innerHTML=""};</script></body></html>
