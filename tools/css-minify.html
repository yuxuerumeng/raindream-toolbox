<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS 压缩 — ToolBox</title>
<meta name="description" content="在线CSS压缩工具，一键压缩CSS代码。">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script>
</head><body>
<nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span data-i18n="back_home">返回首页</span></a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav>
<header class="tool-header"><h1 data-i18n="tool_css_title">CSS 压缩</h1><p class="desc" data-i18n="tool_css_desc_full">粘贴 CSS 代码，一键压缩或美化。</p></header>
<div class="tool-body">
  <div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 ]</span></div>
  <div class="form-group"><label data-i18n="label_input">输入 CSS</label><textarea id="input" placeholder="body { margin: 0; padding: 0; }" style="height:200px"></textarea></div>
  <div class="control-row"><button class="btn-primary" id="minify">压缩</button><button class="btn-outline" id="beautify">美化</button><button class="btn-outline" id="clear">清空</button></div>
  <div class="form-group"><label data-i18n="label_output">输出结果</label><textarea id="output" readonly style="height:200px"></textarea></div>
  <button class="btn-sm" id="copy">复制结果</button>
</div>
<div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 ]</span></div>
<footer class="site-footer"><p data-i18n="footer_privacy">所有处理均在浏览器本地完成。</p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p></footer>
<script src="../js/theme.js"></script><script src="../js/i18n.js"></script>
<script>
document.getElementById('minify').onclick=()=>{
  let c=document.getElementById('input').value;
  c=c.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\s+/g,' ').replace(/\s*([{}:;,])\s*/g,'$1').replace(/;}/g,'}').trim();
  document.getElementById('output').value=c;
};
document.getElementById('beautify').onclick=()=>{
  let c=document.getElementById('input').value;
  c=c.replace(/\s*([{}:;,])\s*/g,'$1').replace(/}/g,'}\n').replace(/{/g,'{\n  ').replace(/;/g,';\n  ');
  document.getElementById('output').value=c;
};
document.getElementById('clear').onclick=()=>{document.getElementById('input').value='';document.getElementById('output').value=''};
document.getElementById('copy').onclick=()=>{const v=document.getElementById('output').value;if(v){navigator.clipboard.writeText(v)}};
</script>
</body></html>
