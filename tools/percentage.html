<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>百分比 — ToolBox</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="icon" type="image/svg+xml" href="../favicon.svg"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script></head><body><nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回首页</a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav><header class="tool-header"><h1 data-i18n="tool_bai_fen_bi_ji_suan">百分比计算</h1><p class="desc" data-i18n="tool_ji_suan_bai_fen_bi_zhan_bi_">计算百分比、占比。</p></header><div class="tool-body"><div class="ad-slot horizontal"><span>Ad</span></div><div class="form-group"><label data-i18n="label_unknown">X 的 Y% 是多少</label><div style="display:flex;gap:.5rem;align-items:center"><input type="number" id="x1" value="100"><span>的</span><input type="number" id="y1" value="20"><span>% = </span><strong style="color:var(--accent);font-size:1.2rem" id="r1">20</strong></div></div><div class="form-group"><label data-i18n="label_unknown">X 是 Y 的百分之多少</label><div style="display:flex;gap:.5rem;align-items:center"><input type="number" id="x2" value="25"><span>是</span><input type="number" id="y2" value="100"><span>的 </span><strong style="color:var(--accent);font-size:1.2rem" id="r2">25%</strong></div></div></div><div class="ad-slot horizontal"><span>Ad</span></div><footer class="site-footer"><p>所有处理均在浏览器本地完成。</p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p></footer><script src="../js/theme.js"></script><script>function c(){var x1=parseFloat(document.getElementById("x1").value)||0,y1=parseFloat(document.getElementById("y1").value)||0;document.getElementById("r1").textContent=(x1*y1/100).toFixed(2);var x2=parseFloat(document.getElementById("x2").value)||0,y2=parseFloat(document.getElementById("y2").value)||0;document.getElementById("r2").textContent=y2?(x2/y2*100).toFixed(2)+"%":"—"}["x1","y1","x2","y2"].forEach(function(id){document.getElementById(id).oninput=c});c();</script></body></html>
