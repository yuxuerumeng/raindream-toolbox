<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UUID 生成器 — ToolBox</title>
<meta name="description" content="在线UUID生成器，一键生成UUID v4，支持批量生成。">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head><body>
<nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg data-i18n="back_home">返回首页</a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav>
<header class="tool-header"><h1 data-i18n="tool_uuid_title">UUID 生成器</h1><p class="desc" data-i18n="tool_uuid_desc_full">一键生成 UUID v4，支持单个或批量生成。</p></header>
<div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 — 部署后替换为 AdSense 代码 ]</span></div>
<div class="tool-body" style="max-width:500px">
  <div class="control-row"><label data-i18n="生成数量">生成数量<input type="number" id="count" value="1" min="1" max="100" style="width:80px"></div>
  <button class="btn-primary" id="gen" data-i18n="生成 UUID">生成 UUID
  <div class="code-output" id="result" style="margin-top:1.25rem;min-height:60px"></div>
  <button class="btn-sm" id="copy" style="margin-top:.75rem" data-i18n="btn_copy_all">复制全部
</div>
<div class="ad-slot horizontal"><span>[ 广告位 ]</span></div>
<footer class="site-footer"><p><span data-i18n="footer_copy">&copy; 2026 ToolBox</span></p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p>
</footer>
<div class="toast" id="toast"></div>
<script>
function uuid(){return'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:r&0x3|0x8).toString(16)})}
document.getElementById('gen').onclick=()=>{
  const n=parseInt(document.getElementById('count').value)||1;
  document.getElementById('result').textContent=Array.from({length:n},()=>uuid()).join('\n');
};
document.getElementById('copy').onclick=()=>{const v=document.getElementById('result').textContent;if(v){navigator.clipboard.writeText(v);show('已复制'+n+' UUID')}};
function show(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
</script>
<script src="../js/theme.js"></script></body></html>
