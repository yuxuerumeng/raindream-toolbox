<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UUID 生成器 — ToolBox</title>
<meta name="description" content="在线UUID生成器，一键生成UUID v4，支持批量生成。">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head><body>
<nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回首页</a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav>
<header class="tool-header"><h1>UUID 生成器</h1><p class="desc">一键生成 UUID v4，支持单个或批量生成。</p></header>
<div class="tool-body" style="max-width:500px">
  <div class="control-row"><label>生成数量</label><input type="number" id="count" value="1" min="1" max="100" style="width:80px"></div>
  <button class="btn-primary" id="gen">生成 UUID</button>
  <div class="code-output" id="result" style="margin-top:1.25rem;min-height:60px"></div>
  <button class="btn-sm" id="copy" style="margin-top:.75rem">复制全部</button>
</div>
<div class="ad-slot horizontal"><span>[ 广告位 ]</span></div>
<footer class="site-footer"><p>&copy; 2026 ToolBox</p></footer>
<div class="toast" id="toast"></div>
<script>
function uuid(){return'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:r&0x3|0x8).toString(16)})}
document.getElementById('gen').onclick=()=>{
  const n=parseInt(document.getElementById('count').value)||1;
  document.getElementById('result').textContent=Array.from({length:n},()=>uuid()).join('\n');
};
document.getElementById('copy').onclick=()=>{const v=document.getElementById('result').textContent;if(v){navigator.clipboard.writeText(v);show('已复制'+n+' UUID')}};
function show(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
</script>
</body></html>
