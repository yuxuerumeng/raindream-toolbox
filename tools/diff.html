<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本对比 — ToolBox</title>
<meta name="description" content="在线文本差异对比工具，左右分栏高亮显示不同之处。">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>.diff-ins{background:rgba(52,199,89,.2);color:#34c759}.diff-del{background:rgba(255,69,58,.2);color:#ff453a;text-decoration:line-through}.diff-eq{color:rgba(255,255,255,.5)}.diff-line{font-family:"SF Mono","Fira Code",monospace;font-size:.78rem;padding:.15rem .5rem;white-space:pre-wrap;word-break:break-all}</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head><body>
<nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg data-i18n="back_home">返回首页</a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav>
<header class="tool-header"><h1 data-i18n="tool_diff_title">文本对比</h1><p class="desc" data-i18n="tool_diff_desc_full">左右粘贴两段文本，高亮显示差异。</p></header>
<div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 — 部署后替换为 AdSense 代码 ]</span></div>
<div class="tool-body" style="max-width:960px">
  <div style="display:flex;gap:1rem;flex-wrap:wrap">
    <div style="flex:1;min-width:0"><div class="form-group"><label data-i18n="原始文本">原始文本<textarea id="oldText" style="height:250px" data-i18n-placeholder="placeholder_粘贴原始文本..." placeholder="粘贴原始文本..." data-i18n-placeholder="input_content"></textarea></div></div>
    <div style="flex:1;min-width:0"><div class="form-group"><label data-i18n="新文本">新文本<textarea id="newText" style="height:250px" data-i18n-placeholder="placeholder_粘贴新文本..." placeholder="粘贴新文本..." data-i18n-placeholder="input_content"></textarea></div></div>
  </div>
  <button class="btn-primary" id="compare" data-i18n="btn_compare">对比
  <div id="diffResult" style="margin-top:1.25rem;background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.04);border-radius:10px;padding:1rem;font-size:.78rem;max-height:400px;overflow:auto"></div>
</div>
<div class="ad-slot horizontal"><span>[ 广告位 ]</span></div>
<footer class="site-footer"><p><span data-i18n="footer_copy">&copy; 2026 ToolBox</span></p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p>
</footer>
<script>
function lcs(a,b){
  const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const res=[];let i=m,j=n;
  while(i>0&&j>0){if(a[i-1]===b[j-1]){res.unshift([i-1,j-1]);i--;j--}else if(dp[i-1][j]>dp[i][j-1])i--;else j--}
  return res;
}
document.getElementById('compare').onclick=()=>{
  const oldL=document.getElementById('oldText').value.split('\n'),newL=document.getElementById('newText').value.split('\n');
  const maxLen=Math.max(oldL.length,newL.length);
  let html='';
  for(let i=0;i<maxLen;i++){
    const o=oldL[i]||'',n=newL[i]||'';
    if(o===n)html+='<div class="diff-line diff-eq">  '+esc(o)+'</div>';
    else{
      if(o)html+='<div class="diff-line diff-del">- '+esc(o)+'</div>';
      if(n)html+='<div class="diff-line diff-ins">+ '+esc(n)+'</div>';
    }
  }
  document.getElementById('diffResult').innerHTML=html||'无差异';
};
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
</script>
<script src="../js/theme.js"></script><script src="../js/i18n.js"></script></body></html>
