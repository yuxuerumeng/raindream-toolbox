<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哈希生成 — ToolBox</title><meta name="description" content="MD5/SHA哈希在线生成。">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css"><link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script>
</head><body>
<nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span data-i18n="back_home">返回首页</span></a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav>
<header class="tool-header"><h1 data-i18n="tool_hash_title">哈希生成</h1><p class="desc" data-i18n="tool_hash_desc">输入文本，生成 MD5 / SHA 哈希值。</p></header>
<div class="tool-body">
  <div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 ]</span></div>
  <div class="form-group"><label data-i18n="输入文本">输入文本<textarea id="input" data-i18n-placeholder="placeholder_输入要哈希的文本..." placeholder="输入要哈希的文本..."></textarea></div>
  <div class="control-row">
    <select id="algo"><option value="SHA-256">SHA-256</option><option value="SHA-1">SHA-1</option><option value="SHA-512">SHA-512</option><option value="MD5">MD5</option></select>
    <button class="btn-primary" id="gen" data-i18n="生成哈希">生成哈希
  </div>
  <div class="form-group"><label data-i18n="哈希结果">哈希结果<div class="code-output mono" id="result" style="word-break:break-all"></div></div>
  <button class="btn-sm" id="copy" data-i18n="btn_copy">复制结果
</div>
<div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 ]</span></div>
<footer class="site-footer"><p data-i18n="footer_privacy">所有处理均在浏览器本地完成。</p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p></footer>
<script src="../js/theme.js"></script>
<script>
document.getElementById('gen').onclick=async()=>{
  const t=document.getElementById('input').value;
  const a=document.getElementById('algo').value;
  const e=new TextEncoder().encode(t);
  const h=await crypto.subtle.digest(a,e);
  document.getElementById('result').textContent=Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
};
document.getElementById('copy').onclick=()=>{const v=document.getElementById('result').textContent;if(v)navigator.clipboard.writeText(v)};
</script>
</body></html>
