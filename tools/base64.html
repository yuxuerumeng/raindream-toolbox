<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 编解码 — ToolBox</title>
<meta name="description" content="在线Base64编码解码工具，支持文本和图片。">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head><body>
<nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg data-i18n="back_home">返回首页</a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav>
<header class="tool-header"><h1>Base64 编解码</h1><p class="desc">文本与 Base64 互相转换，也支持图片转 Base64。</p></header>
<div class="tool-body">
  <div class="form-group"><label>输入内容</label><textarea id="input" placeholder="输入要编码的文本或 Base64 字符串..."></textarea></div>
  <div class="control-row"><button class="btn-primary" id="encode">编码 (Encode)</button><button class="btn-outline" id="decode">解码 (Decode)</button><button class="btn-outline" id="clear">清空</button></div>
  <div class="form-group"><label>图片转 Base64</label><div style="display:flex;gap:.5rem;align-items:center"><button class="btn-sm" onclick="document.getElementById('imgInput').click()">选择图片</button><span id="imgName" style="font-size:.78rem;color:rgba(255,255,255,.35)"></span><input type="file" id="imgInput" accept="image/*"></div></div>
  <div class="form-group"><label>输出结果</label><textarea id="output" readonly></textarea></div>
  <button class="btn-sm" id="copy">复制结果</button>
</div>
<div class="ad-slot horizontal"><span>[ 广告位 ]</span></div>
<footer class="site-footer"><p><span data-i18n="footer_copy">&copy; 2026 ToolBox</span></p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p>
</footer>
<div class="toast" id="toast"></div>
<script>
document.getElementById('encode').onclick=()=>{try{document.getElementById('output').value=btoa(unescape(encodeURIComponent(document.getElementById('input').value)))}catch(e){document.getElementById('output').value=btoa(document.getElementById('input').value)}};
document.getElementById('decode').onclick=()=>{try{document.getElementById('output').value=decodeURIComponent(escape(atob(document.getElementById('input').value)))}catch(e){try{document.getElementById('output').value=atob(document.getElementById('input').value)}catch(e2){document.getElementById('output').value='解码失败: '+e2.message}}};
document.getElementById('clear').onclick=()=>{document.getElementById('input').value='';document.getElementById('output').value=''};
document.getElementById('copy').onclick=()=>{const v=document.getElementById('output').value;if(v){navigator.clipboard.writeText(v);show('已复制')}};
document.getElementById('imgInput').onchange=function(){const f=this.files[0];if(!f)return;document.getElementById('imgName').textContent=f.name;const r=new FileReader();r.onload=()=>{document.getElementById('output').value=r.result};r.readAsDataURL(f)};
function show(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
</script>
<script src="../js/theme.js"></script><script src="../js/i18n.js"></script></body></html>
