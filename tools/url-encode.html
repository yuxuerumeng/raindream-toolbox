<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL 编解码 — ToolBox</title>
<meta name="description" content="在线URL编码解码工具，一键转换。">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head><body>
<nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg data-i18n="back_home">返回首页</a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav>
<header class="tool-header"><h1>URL 编解码</h1><p class="desc">URL编码与解码，输入内容即时转换。</p></header>
<div class="tool-body">
  <div class="form-group"><label>输入内容</label><textarea id="input" placeholder="输入要编码的URL或要解码的字符串..."></textarea></div>
  <div class="control-row"><button class="btn-primary" id="encode">URL 编码</button><button class="btn-outline" id="decode">URL 解码</button><button class="btn-outline" id="clear">清空</button></div>
  <div class="form-group"><label>输出结果</label><textarea id="output" readonly></textarea></div>
  <button class="btn-sm" id="copy">复制结果</button>
</div>
<div class="ad-slot horizontal"><span>[ 广告位 ]</span></div>
<footer class="site-footer"><p><span data-i18n="footer_copy">&copy; 2026 ToolBox</span></p></footer>
<div class="toast" id="toast"></div>
<script>
document.getElementById('encode').onclick=()=>{document.getElementById('output').value=encodeURIComponent(document.getElementById('input').value)};
document.getElementById('decode').onclick=()=>{try{document.getElementById('output').value=decodeURIComponent(document.getElementById('input').value)}catch(e){document.getElementById('output').value='解码失败: '+e.message}};
document.getElementById('clear').onclick=()=>{document.getElementById('input').value='';document.getElementById('output').value=''};
document.getElementById('copy').onclick=()=>{const v=document.getElementById('output').value;if(v){navigator.clipboard.writeText(v);show('已复制')}};
function show(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
</script>
<script src="../js/i18n.js"></script></body></html>
