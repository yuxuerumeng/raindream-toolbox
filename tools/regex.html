<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正则测试 — ToolBox</title><meta name="description" content="在线正则表达式测试工具。">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css"><link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script>
<style>.match{background:rgba(52,199,89,.3);border-radius:2px}</style>
</head><body>
<nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span data-i18n="back_home">返回首页</span></a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav>
<header class="tool-header"><h1 data-i18n="tool_regex_title">正则测试</h1><p class="desc" data-i18n="tool_regex_desc">输入正则表达式和测试文本，实时高亮匹配。</p></header>
<div class="tool-body">
  <div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 ]</span></div>
  <div class="form-group"><label data-i18n="正则表达式">正则表达式<input type="text" id="pattern" placeholder="/pattern/flags" class="mono"></div>
  <div class="control-row"><button class="btn-sm" id="gFlag">g</button><button class="btn-sm" id="iFlag">i</button><button class="btn-sm" id="mFlag">m</button><span style="font-size:.72rem;color:var(--text3)">点击切换标志</span></div>
  <div class="form-group"><label data-i18n="测试文本">测试文本<textarea id="text" data-i18n-placeholder="placeholder_输入测试文本..." placeholder="输入测试文本..."></textarea></div>
  <div class="form-group"><label data-i18n="匹配结果">匹配结果<div class="code-output" id="result" style="min-height:60px"></div></div>
</div>
<div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 ]</span></div>
<footer class="site-footer"><p data-i18n="footer_privacy">所有处理均在浏览器本地完成。</p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p></footer>
<script src="../js/theme.js"></script>
<script>
let flags={g:false,i:false,m:false};
['gFlag','iFlag','mFlag'].forEach(id=>{
  const k=id[0];document.getElementById(id).onclick=function(){flags[k]=!flags[k];this.classList.toggle('btn-primary',flags[k]);this.classList.toggle('btn-sm',!flags[k]);test()};
});
document.getElementById('pattern').oninput=test;
document.getElementById('text').oninput=test;
function test(){
  const p=document.getElementById('pattern').value;
  const t=document.getElementById('text').value;
  if(!p){document.getElementById('result').innerHTML='';return}
  try{
    let f='';if(flags.g)f+='g';if(flags.i)f+='i';if(flags.m)f+='m';
    const r=new RegExp(p,f);
    const matches=[...t.matchAll(r)];
    if(matches.length){
      let h=t;
      let off=0;
      matches.forEach(m=>{
        const s=m.index+off,e=s+m[0].length;
        h=h.slice(0,s)+'<span class="match">'+h.slice(s,e)+'</span>'+h.slice(e);
        off+='<span class="match"></span>'.length;
      });
      document.getElementById('result').innerHTML=h+'<br><br>共 '+matches.length+' 处匹配';
    }else{document.getElementById('result').textContent='无匹配'}
  }catch(e){document.getElementById('result').innerHTML='<span style="color:#ff453a">'+e.message+'</span>'}
}
</script>
</body></html>
