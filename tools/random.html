<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>随机数 — ToolBox</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="icon" type="image/svg+xml" href="../favicon.svg"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script></head><body><nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span data-i18n="back_home">返回首页</span></a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav><header class="tool-header"><h1 data-i18n="tool_sui_ji_shu_sheng_cheng">随机数生成</h1><p class="desc" data-i18n="tool_sheng_cheng_zhi_ding_fan_wei_de_sui_ji_shu_">生成指定范围的随机数。</p></header><div class="tool-body"><div class="ad-slot horizontal"><span data-i18n="ad_placeholder">Ad</span></div><div class="control-row"><label data-i18n="最小值">最小值<input type="number" id="min" value="1"><label data-i18n="最大值">最大值<input type="number" id="max" value="100"><label data-i18n="小数位">小数位<input type="number" id="dec" value="0" min="0" max="10" style="width:60px"></div><div style="text-align:center;margin:1.5rem 0"><div style="font-size:3rem;font-weight:700;color:var(--accent)" id="result">—</div></div><div style="text-align:center"><button class="btn-primary" id="gen" data-i18n="btn_gen">生成<button class="btn-outline" id="gen10" data-i18n="btn_gen10">生成10个</div><div class="code-output" id="list" style="margin-top:1rem;text-align:center"></div></div><div class="ad-slot horizontal"><span data-i18n="ad_placeholder">Ad</span></div><footer class="site-footer"><p data-i18n="footer_privacy">所有处理均在浏览器本地完成。</p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p></footer><script src="../js/theme.js"></script><script>function g(){var a=parseFloat(document.getElementById("min").value)||0,b=parseFloat(document.getElementById("max").value)||100,d=parseInt(document.getElementById("dec").value)||0;document.getElementById("result").textContent=(a+Math.random()*(b-a)).toFixed(d)}document.getElementById("gen").onclick=g;document.getElementById("gen10").onclick=function(){var a=parseFloat(document.getElementById("min").value)||0,b=parseFloat(document.getElementById("max").value)||100,d=parseInt(document.getElementById("dec").value)||0,s="";for(var i=0;i<10;i++)s+=(a+Math.random()*(b-a)).toFixed(d)+"  ";document.getElementById("list").textContent=s};g();</script></body></html>
