<header class="tool-header"><h1 data-i18n="tool_bili_title">B站视频下载</h1><p class="desc" data-i18n="tool_bili_desc_full">粘贴B站视频链接，获取视频和封面下载。</p></header>
<div class="tool-body">
  <div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 ]</span></div>
  <div class="form-group"><label>B站视频链接</label><input type="text" id="url" placeholder="https://www.bilibili.com/video/BV..."></div>
  <button class="btn-primary" id="extract">解析视频</button>
  <div id="result" style="margin-top:1.5rem"></div>
</div>
<div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 ]</span></div>
<footer class="site-footer"><p data-i18n="footer_privacy">所有处理均在浏览器本地完成。</p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p></footer>
<script src="../js/theme.js"></script><script src="../js/i18n.js"></script>
<script>
document.getElementById('extract').onclick=async()=>{
  const u=document.getElementById('url').value.trim();
  const res=document.getElementById('result');
  if(!u){res.innerHTML='<p style="color:#ff453a">请输入链接</p>';return}
  res.innerHTML='<p style="color:var(--text3)">解析中...</p>';
  try{
    const r=await fetch('/api/bilibili?url='+encodeURIComponent(u));
    const d=await r.json();
    if(d.error){res.innerHTML='<p style="color:#ff453a">'+d.error+'</p>';return}
    let h='';
    if(d.pic){
      h+='<div style="margin-bottom:1rem;max-width:400px"><img src="'+d.pic+'" style="width:100%;border-radius:10px" alt=""><a href="'+d.pic+'" download target="_blank" class="btn-outline" style="display:block;text-align:center;margin-top:.5rem">下载封面</a></div>';
    }
    h+='<h3 style="margin-bottom:.75rem">'+(d.title||'无标题')+'</h3>';
    if(d.video){
      h+='<a href="'+d.video+'" target="_blank" class="btn-primary">下载视频</a>';
    }else{
      h+='<p style="color:var(--text3)">未获取到视频链接，请检查链接或稍后重试</p>';
    }
    res.innerHTML=h;
  }catch(e){res.innerHTML='<p style="color:#ff453a">请求失败: '+e.message+'</p>'}
};
</script>
