<header class="tool-header"><h1 data-i18n="tool_bili_title">B站视频下载</h1><p class="desc" data-i18n="tool_bili_desc_full">粘贴B站链接，即可播放和下载。</p></header>
<div class="tool-body">
  <div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 ]</span></div>
  <div class="form-group"><label>B站视频链接</label>
    <div style="display:flex;gap:.5rem"><input type="text" id="url" placeholder="https://www.bilibili.com/video/BV..."><button class="btn-primary" id="load">播放</button><button class="btn-outline" id="dl">下载</button></div>
  </div>
  <div id="player"></div>
</div>
<div class="ad-slot horizontal"><span data-i18n="ad_placeholder">[ 广告位 ]</span></div>
<footer class="site-footer"><p data-i18n="footer_privacy">所有处理均在浏览器本地完成。</p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p></footer>
<script src="../js/theme.js"></script><script src="../js/i18n.js"></script>
<script>
const API="https://platform.snapany.com/api/v1/download";
const KEY="sk_snapany_e8ybugbkxr1opmvfeye18sanlvsqonr0";
document.getElementById("load").onclick=()=>{
  const u=document.getElementById("url").value.trim();
  const m=u.match(/BV[a-zA-Z0-9]{10}/);
  if(!m){document.getElementById("player").innerHTML="<p>无效链接</p>";return}
  document.getElementById("player").innerHTML='<div class="player-wrap"><iframe src="https://player.bilibili.com/player.html?bvid='+m[0]+'&page=1&high_quality=1" allowfullscreen></iframe></div>';
};
document.getElementById("dl").onclick=async()=>{
  const u=document.getElementById("url").value.trim();
  if(!u)return;
  document.getElementById("player").innerHTML='<p style="color:var(--text3)">正在获取下载链接...</p>';
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+KEY},body:JSON.stringify({url:u})});
    const d=await r.json();
    if(d.success && d.data){
      let h='<p style="margin-bottom:.5rem"><strong>'+ (d.data.title||"") +'</strong></p>';
      if(d.data.medias) d.data.medias.forEach(m=>{h+='<a href="'+m.url+'" target="_blank" class="dl-link">'+ (m.quality||"下载") +'</a>'});
      else if(d.data.url) h+='<a href="'+d.data.url+'" target="_blank" class="btn-primary">下载视频</a>';
      document.getElementById("player").innerHTML=h;
    }else{document.getElementById("player").innerHTML='<p style="color:#ff453a">'+(d.message||"获取失败")+'</p>'}
  }catch(e){document.getElementById("player").innerHTML='<p style="color:#ff453a">请求失败</p>'}
};
</script>
</body></html>
