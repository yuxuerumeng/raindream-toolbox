<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>列表工具 — ToolBox</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="icon" type="image/svg+xml" href="../favicon.svg"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script></head><body><nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回首页</a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav><header class="tool-header"><h1>列表工具</h1><p class="desc">排序、去重、随机打乱。</p></header><div class="tool-body"><div class="ad-slot horizontal"><span>Ad</span></div><div class="form-group"><label>输入</label><textarea id="input" placeholder="每行一项..."></textarea></div><div class="control-row"><button class="btn-primary" id="sort">排序 A-Z</button><button class="btn-outline" id="dedupe">去重</button><button class="btn-outline" id="shuffle">随机打乱</button><button class="btn-outline" id="reverse">反转</button></div><div class="form-group"><label>输出</label><textarea id="output" readonly></textarea></div><button class="btn-sm" id="copy">复制结果</button></div><div class="ad-slot horizontal"><span>Ad</span></div><footer class="site-footer"><p>所有处理均在浏览器本地完成。</p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p></footer><script src="../js/theme.js"></script><script>var i=document.getElementById("input"),o=document.getElementById("output");function g(){return i.value.split("
").filter(function(l){return l.trim()})}document.getElementById("sort").onclick=function(){o.value=g().sort().join("
")};document.getElementById("dedupe").onclick=function(){o.value=[...new Set(g())].join("
")};document.getElementById("shuffle").onclick=function(){var a=g();for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=a[j];a[j]=a[k];a[k]=t}o.value=a.join("
")};document.getElementById("reverse").onclick=function(){o.value=g().reverse().join("
")};document.getElementById("copy").onclick=function(){if(o.value)navigator.clipboard.writeText(o.value)};</script></body></html>
