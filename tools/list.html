<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>列表工具 — ToolBox</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="icon" type="image/svg+xml" href="../favicon.svg"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script></head><body><nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span data-i18n="back_home">返回首页</span></a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav><header class="tool-header"><h1>列表工具</h1><p class="desc">排序、去重、随机打乱。</p></header><div class="tool-body"><div class="ad-slot horizontal"><span data-i18n="ad_placeholder">Ad</span></div><div class="form-group"><label>输入</label><textarea id="input" placeholder="u6bcfu884cu4e00u9879..."></textarea></div><div class="control-row"><button class="btn-primary" id="sort">u6392u5e8f A-Z</button><button class="btn-outline" id="dedupe">u53bbu91cd</button><button class="btn-outline" id="shuffle">u968fu673au6253u4e71</button><button class="btn-outline" id="reverse">u53cdu8f6c</button></div><div class="form-group"><label>输出</label><textarea id="output" readonly></textarea></div><button class="btn-sm" id="copy">u590du5236u7ed3u679c</button></div><div class="ad-slot horizontal"><span data-i18n="ad_placeholder">Ad</span></div><footer class="site-footer"><p data-i18n="footer_privacy">所有处理均在浏览器本地完成。</p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p></footer><script src="../js/theme.js"></script><script src="../js/i18n.js"></script><script>var i=document.getElementById('input'),o=document.getElementById('output');function g(){return i.value.split('\n').filter(function(l){return l.trim()})}document.getElementById('sort').onclick=function(){o.value=g().sort().join('\n')};document.getElementById('dedupe').onclick=function(){o.value=[...new Set(g())].join('\n')};document.getElementById('shuffle').onclick=function(){var a=g();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}o.value=a.join('\n')};document.getElementById('reverse').onclick=function(){o.value=g().reverse().join('\n')};document.getElementById('copy').onclick=function(){if(o.value)navigator.clipboard.writeText(o.value)};</script></body></html>
