<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>渐变 — ToolBox</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="icon" type="image/svg+xml" href="../favicon.svg"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9707601185440297" crossorigin="anonymous"></script></head><body><nav class="nav"><a href="../index.html" class="nav-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span data-i18n="back_home">返回首页</span></a><a href="../index.html" class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>ToolBox</a></nav><header class="tool-header"><h1>渐变生成</h1><p class="desc">可视化生成 CSS 渐变代码。</p></header><div class="tool-body"><div class="ad-slot horizontal"><span data-i18n="ad_placeholder">Ad</span></div><div style="width:100%;height:120px;border-radius:12px;margin-bottom:1rem" id="prev"></div><div class="control-row"><label>颜色1</label><input type="color" id="c1" value="#0071ED"><label>颜色2</label><input type="color" id="c2" value="#BF5AF2"><label>角度</label><input type="range" id="deg" min="0" max="360" value="135"><span id="dv">135u00b0</span></div><div class="form-group"><label>CSS</label><div class="code-output mono" id="css"></div></div><button class="btn-sm" id="copy">复制 CSS</button></div><div class="ad-slot horizontal"><span data-i18n="ad_placeholder">Ad</span></div><footer class="site-footer"><p data-i18n="footer_privacy">所有处理均在浏览器本地完成。</p><p style="margin-top:.5rem;color:rgba(255,255,255,.2);font-size:.7rem">Made by <a href="https://i.raindream.top" target="_blank" style="color:rgba(255,255,255,.35)">雨梦 RainDream</a></p></footer><script src="../js/theme.js"></script><script src="../js/i18n.js"></script><script>function u(){var c1=document.getElementById('c1').value,c2=document.getElementById('c2').value,d=document.getElementById('deg').value;document.getElementById('dv').textContent=d+'u00b0';var css='background: linear-gradient('+d+'deg, '+c1+', '+c2+');';document.getElementById('prev').style.background=css;document.getElementById('css').textContent=css}['c1','c2','deg'].forEach(function(id){document.getElementById(id).oninput=u});document.getElementById('copy').onclick=function(){navigator.clipboard.writeText(document.getElementById('css').textContent)};u();</script></body></html>
